name: cooperadora_escuela2
description: Aplicación de gestión de la Comisión Cooperadora de la Escuela N.º 2 Nicolás Antonio.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/comprobante_base.jpg
    - assets/images/fondo_cooperadora.jpg
    - assets/images/escudo_alternativo.jpg
